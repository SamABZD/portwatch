[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "portwatch"
version = "0.1.0"
description = "Local-first Port of Los Angeles data engineering portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2,<3",
  "pyarrow>=26,<27",
  "psycopg[binary]>=3.2,<4",
  "psutil>=7,<8",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "shapely>=2.1,<3",
  "typer>=0.12,<1",
  "tzdata>=2024.1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.10,<4",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real PostgreSQL checks enabled by PORTWATCH_TEST_DB=1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
